<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BelloraHome Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f6f1ea; --sand: #ece3d6; --white: #fffdf9; --ink: #1e1b18; --ink-2: #6b6359; --line: #e3d9cb;
      --accent: #b5562f; --sage: #6f8a64;
      --s-nova: #b5562f; --s-potvrdjena: #8a6d1f; --s-poslana: #3f6b8a; --s-isporucena: #4f7a45; --s-otkazana: #8b8580;
      --serif: "Fraunces", Georgia, serif; --sans: "Manrope", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: var(--sans); background: var(--cream); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    .wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
    .logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; letter-spacing: -.02em; }
    .logo span { font-style: italic; font-weight: 400; color: var(--accent); }
    .btn { background: var(--ink); color: var(--white); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: .9rem; }
    .btn:hover { background: var(--accent); }
    .btn--ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
    .btn--ghost:hover { background: var(--white); color: var(--ink); border-color: var(--ink); }
    .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Prijava */
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login form { background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 36px; width: min(380px, 100%); display: grid; gap: 14px; }
    .login h1 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; }
    .login input { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--cream); }
    .err { color: var(--accent); font-size: .88rem; min-height: 1.2em; }

    /* Zaglavlje */
    header { position: sticky; top: 0; z-index: 10; background: rgba(246, 241, 234, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; gap: 14px; height: 64px; }
    header .tag { font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-2); font-weight: 700; }
    header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .updated { font-size: .78rem; color: var(--ink-2); }

    main { padding-block: 28px 60px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
    .stat { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
    .stat small { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); font-weight: 700; }
    .stat b { font-family: var(--serif); font-weight: 400; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
    .stat.hot b { color: var(--accent); }

    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .filters { display: flex; gap: 4px; padding: 4px; background: var(--sand); border-radius: 999px; flex-wrap: wrap; }
    .filters button { padding: 8px 14px; border-radius: 999px; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
    .filters button.active { background: var(--white); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .filters i { font-style: normal; font-size: .75rem; opacity: .7; margin-left: 4px; }
    .search { margin-left: auto; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); width: min(280px, 100%); }

    .orders { display: grid; gap: 10px; }
    .order { background: var(--white); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .order.new { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(181, 86, 47, .08); }
    .row { display: grid; grid-template-columns: 150px 1.4fr 1fr 120px 130px 24px; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; text-align: left; width: 100%; }
    .row:hover { background: #fffaf3; }
    .nr { font-weight: 700; font-variant-numeric: tabular-nums; font-size: .92rem; }
    .date { font-size: .78rem; color: var(--ink-2); }
    .who b { display: block; }
    .who span, .where { font-size: .84rem; color: var(--ink-2); }
    .sum { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
    .pill { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; color: #fff; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.85); }
    .chev { transition: transform .2s; color: var(--ink-2); }
    .order.open .chev { transform: rotate(180deg); }

    .detail { border-top: 1px solid var(--line); padding: 20px 18px 22px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 26px; background: #fffbf6; }
    .detail h4 { font-size: .74rem; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-2); margin-bottom: 8px; }
    .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: .9rem; }
    .kv dt { color: var(--ink-2); }
    .kv a { color: var(--accent); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); padding: 0 0 6px; }
    td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
    td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td small { color: var(--ink-2); }
    .totals { margin-top: 10px; display: grid; gap: 3px; font-size: .9rem; }
    .totals div { display: flex; justify-content: space-between; }
    .totals .grand { font-weight: 700; font-size: 1.05rem; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
    .actions { display: grid; gap: 10px; margin-top: 16px; }
    .actions label { font-size: .8rem; font-weight: 700; color: var(--ink-2); display: grid; gap: 6px; }
    .actions select, .actions textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
    .actions .line { display: flex; gap: 8px; flex-wrap: wrap; }
    .warn { font-size: .82rem; color: var(--accent); margin-top: 8px; }
    .empty { text-align: center; padding: 60px 16px; color: var(--ink-2); background: var(--white); border: 1px dashed var(--line); border-radius: 16px; }
    .empty b { display: block; font-family: var(--serif); font-weight: 400; font-size: 1.3rem; color: var(--ink); margin-bottom: 6px; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 160%); background: var(--ink); color: var(--cream); padding: 12px 20px; border-radius: 999px; font-size: .9rem; transition: transform .3s; z-index: 50; }
    .toast.show { transform: translate(-50%, 0); }

    @media (max-width: 860px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .row { grid-template-columns: 1fr auto; gap: 6px 12px; }
      .row .where, .row .chev { display: none; }
      .row .sum { text-align: right; }
      .detail { grid-template-columns: 1fr; }
      .search { margin-left: 0; width: 100%; }
      header .updated { display: none; }
    }
    @media print {
      header, .stats, .bar, .actions, .row .chev, .order:not(.printing) { display: none !important; }
      body { background: #fff; }
      .order.printing { border: 0; }
      .order.printing .detail { display: grid !important; background: #fff; grid-template-columns: 1fr 1.4fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <section class="login" id="login">
    <form id="loginForm">
      <div class="logo">Bellora<span>Home</span></div>
      <h1>Admin panel</h1>
      <label for="pass" style="font-size:.85rem;font-weight:600">Lozinka</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Prijavi se</button>
      <p class="err" id="loginErr"></p>
    </form>
  </section>

  <div id="app" hidden>
    <header>
      <div class="wrap">
        <div class="logo">Bellora<span>Home</span></div>
        <span class="tag">Narudžbe</span>
        <div class="right">
          <span class="updated" id="updated"></span>
          <button class="btn btn--ghost" id="refresh">Osvježi</button>
          <button class="btn btn--ghost" id="logout">Odjava</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="stats" id="stats"></section>
      <div class="bar">
        <div class="filters" id="filters"></div>
        <input class="search" id="search" type="search" placeholder="Traži: broj, ime, telefon, grad…" aria-label="Pretraga narudžbi">
      </div>
      <section class="orders" id="orders"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

<script>
const STATUS = {
  nova:       { label: "Nova",        color: "var(--s-nova)" },
  potvrdjena: { label: "Potvrđena",   color: "var(--s-potvrdjena)" },
  poslana:    { label: "Poslana",     color: "var(--s-poslana)" },
  isporucena: { label: "Isporučena",  color: "var(--s-isporucena)" },
  otkazana:   { label: "Otkazana",    color: "var(--s-otkazana)" },
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const km = n => Number(n).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " KM";
const when = iso => new Date(iso).toLocaleString("bs-BA", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } },
             set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} },
             del: k => { try { sessionStorage.removeItem(k); } catch {} } };

let token = ss.get("bh_admin"), orders = [], filter = "nova", query = "", open = new Set(), seen = new Set();

async function api(path, opts = {}) {
  const r = await fetch("/api/admin/" + path, { ...opts, headers: { authorization: "Bearer " + token, "content-type": "application/json", ...(opts.headers || {}) } });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { logout("Pogrešna lozinka."); throw new Error("401"); }
  if (!r.ok) throw new Error(data.error || "Greška na serveru.");
  return data;
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2400); }

async function load(silent) {
  try {
    const before = new Set(orders.map(o => o.key));
    const data = await api("orders");
    orders = data.orders;
    if (before.size) orders.forEach(o => { if (!before.has(o.key)) { seen.add(o.key); toast(`Nova narudžba ${o.nr}`); } });
    $("#updated").textContent = "Ažurirano " + new Date().toLocaleTimeString("bs-BA", { hour: "2-digit", minute: "2-digit" });
    render();
  } catch (e) { if (!silent && e.message !== "401") toast(e.message); }
}

function render() {
  const active = orders.filter(o => o.status !== "otkazana");
  const today = new Date().toDateString();
  const newCount = orders.filter(o => o.status === "nova").length;
  const revenue = active.reduce((s, o) => s + o.total, 0);
  $("#stats").innerHTML = `
    <div class="stat ${newCount ? "hot" : ""}"><small>Nove, za obradu</small><b>${newCount}</b></div>
    <div class="stat"><small>Danas</small><b>${orders.filter(o => new Date(o.created).toDateString() === today).length}</b></div>
    <div class="stat"><small>Promet (bez otkazanih)</small><b>${km(revenue)}</b></div>
    <div class="stat"><small>Prosječna narudžba</small><b>${km(active.length ? revenue / active.length : 0)}</b></div>`;

  const counts = { sve: orders.length };
  Object.keys(STATUS).forEach(s => counts[s] = orders.filter(o => o.status === s).length);
  $("#filters").innerHTML = [["nova", "Nove"], ["potvrdjena", "Potvrđene"], ["poslana", "Poslane"], ["isporucena", "Isporučene"], ["otkazana", "Otkazane"], ["sve", "Sve"]]
    .map(([k, l]) => `<button class="${filter === k ? "active" : ""}" data-f="${k}">${l}<i>${counts[k]}</i></button>`).join("");

  const q = query.toLowerCase();
  const list = orders.filter(o => (filter === "sve" || o.status === filter) &&
    (!q || [o.nr, o.customer.name, o.customer.phone, o.customer.city, o.customer.email].join(" ").toLowerCase().includes(q)));

  if (!orders.length) {
    $("#orders").innerHTML = `<div class="empty"><b>Još nema narudžbi</b>Kad kupac naruči na sajtu, narudžba se pojavi ovdje i stigne ti na mail. Stranica se sama osvježava svake minute.</div>`;
    return;
  }
  if (!list.length) { $("#orders").innerHTML = `<div class="empty"><b>Nema narudžbi u ovom pregledu</b>Probaj drugi filter ili pretragu.</div>`; return; }

  $("#orders").innerHTML = list.map(o => {
    const st = STATUS[o.status] || STATUS.nova, isOpen = open.has(o.key);
    return `<article class="order ${isOpen ? "open" : ""} ${seen.has(o.key) ? "new" : ""}" data-key="${esc(o.key)}">
      <button class="row" data-toggle aria-expanded="${isOpen}">
        <div><div class="nr">${esc(o.nr)}</div><div class="date">${when(o.created)}</div></div>
        <div class="who"><b>${esc(o.customer.name)}</b><span>${esc(o.customer.phone)}</span></div>
        <div class="where">${esc(o.customer.city)}</div>
        <div class="sum">${km(o.total)}</div>
        <span class="pill" style="background:${st.color}">${st.label}</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      ${isOpen ? detailHTML(o) : ""}
    </article>`;
  }).join("");
}

function detailHTML(o) {
  const c = o.customer;
  return `<div class="detail">
    <div>
      <h4>Kupac</h4>
      <dl class="kv">
        <dt>Ime</dt><dd>${esc(c.name)}</dd>
        <dt>Telefon</dt><dd><a href="tel:${esc(c.phone.replace(/[^+0-9]/g, ""))}">${esc(c.phone)}</a></dd>
        <dt>Email</dt><dd>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : "—"}</dd>
        <dt>Adresa</dt><dd>${esc(c.address)}<br>${esc(c.zip)} ${esc(c.city)}</dd>
        <dt>Plaćanje</dt><dd>Pouzećem</dd>
        ${c.note ? `<dt>Napomena</dt><dd>${esc(c.note)}</dd>` : ""}
      </dl>
      <div class="actions">
        <label>Status
          <select data-status>${Object.entries(STATUS).map(([k, s]) => `<option value="${k}" ${o.status === k ? "selected" : ""}>${s.label}</option>`).join("")}</select>
        </label>
        <label>Interna bilješka (vidiš samo ti)
          <textarea data-note rows="2" placeholder="npr. poslano Euro Expressom, broj pošiljke…">${esc(o.adminNote)}</textarea>
        </label>
        <div class="line">
          <button class="btn" data-save>Sačuvaj</button>
          <button class="btn btn--ghost" data-copy>Kopiraj adresu za kurira</button>
          <button class="btn btn--ghost" data-print>Štampaj</button>
        </div>
        ${o.mailError ? `<p class="warn">Mail za ovu narudžbu nije poslan — narudžba je sačuvana samo ovdje.</p>` : ""}
      </div>
    </div>
    <div>
      <h4>Proizvodi</h4>
      <table>
        <thead><tr><th>Proizvod</th><th style="text-align:right">Kom</th><th style="text-align:right">Iznos</th></tr></thead>
        <tbody>${o.items.map(i => `<tr>
          <td>${esc(i.name)}${i.variant ? `<br><small>${esc(i.variant)}</small>` : ""}${i.code ? `<br><small>Šifra: ${esc(i.code)}</small>` : ""}</td>
          <td class="n">${i.qty} × ${km(i.price)}</td><td class="n">${km(i.sum)}</td></tr>`).join("")}</tbody>
      </table>
      <div class="totals">
        <div><span>Međuzbir</span><span>${km(o.sub)}</span></div>
        ${o.disc ? `<div><span>Popust (${esc(o.promo)})</span><span>−${km(o.disc)}</span></div>` : ""}
        <div><span>Dostava</span><span>${o.ship ? km(o.ship) : "Besplatno"}</span></div>
        <div class="grand"><span>Ukupno za naplatu</span><span>${km(o.total)}</span></div>
      </div>
    </div>
  </div>`;
}

$("#orders").addEventListener("click", async e => {
  const art = e.target.closest(".order"); if (!art) return;
  const key = art.dataset.key, o = orders.find(x => x.key === key);
  if (e.target.closest("[data-toggle]")) { open.has(key) ? open.delete(key) : open.add(key); seen.delete(key); render(); return; }
  if (e.target.closest("[data-save]")) {
    try {
      const res = await api("orders/" + encodeURIComponent(key), { method: "PATCH",
        body: JSON.stringify({ status: art.querySelector("[data-status]").value, adminNote: art.querySelector("[data-note]").value }) });
      Object.assign(o, res.order); toast("Sačuvano"); render();
    } catch (err) { if (err.message !== "401") toast(err.message); }
  }
  if (e.target.closest("[data-copy]")) {
    const c = o.customer, text = `${c.name}\n${c.address}\n${c.zip} ${c.city}\nTel: ${c.phone}\nOtkupnina: ${km(o.total)}`;
    try { await navigator.clipboard.writeText(text); toast("Adresa kopirana"); } catch { prompt("Kopiraj:", text); }
  }
  if (e.target.closest("[data-print]")) { art.classList.add("printing"); window.print(); art.classList.remove("printing"); }
});
$("#filters").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; render(); } });
$("#search").addEventListener("input", e => { query = e.target.value; render(); });
$("#refresh").onclick = () => load();
$("#logout").onclick = () => logout();

function logout(msg) {
  token = null; ss.del("bh_admin"); orders = [];
  $("#app").hidden = true; $("#login").hidden = false; $("#loginErr").textContent = msg || "";
}
async function start() {
  $("#login").hidden = true; $("#app").hidden = false;
  await load();
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  token = $("#pass").value; $("#loginErr").textContent = "";
  try {
    await api("orders"); ss.set("bh_admin", token); $("#pass").value = ""; start();
  } catch (err) { if (err.message !== "401") $("#loginErr").textContent = err.message; }
};
if (token) start();
setInterval(() => { if (token && !document.hidden) load(true); }, 60000);
</script>
</body>
</html>
